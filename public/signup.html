<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Kia Kia — Sign Up</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="css/style.css"/>
  <link rel="stylesheet" href="css/auth.css"/>
</head>
<body>

  <div class="auth-wrapper">
    <div class="auth-card">

      <div class="auth-logo">Kia<span>Kia</span></div>
      <h2>Create your account</h2>
      <p class="subtitle">Start delivering across Lagos in minutes.</p>

      <div class="alert" id="alert"></div>

      <form id="signupForm">
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" placeholder="e.g. tunde_lagos" autocomplete="off"/>
          <div class="error-msg" id="username-error">Username is required</div>
        </div>

        <div class="form-group">
          <label for="email">Email address</label>
          <input type="email" id="email" placeholder="you@example.com"/>
          <div class="error-msg" id="email-error">Enter a valid email</div>
        </div>

        <div class="form-group">
          <label for="role">I am a</label>
          <select id="role">
            <option value="user">Customer — I want to send packages</option>
            <option value="rider">Rider — I want to deliver packages</option>
          </select>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="Min. 5 characters"/>
          <div class="error-msg" id="password-error">Password must be at least 5 characters</div>
        </div>

        <div class="form-group">
          <label for="passwordConfirm">Confirm password</label>
          <input type="password" id="passwordConfirm" placeholder="Repeat your password"/>
          <div class="error-msg" id="confirm-error">Passwords do not match</div>
        </div>

        <button type="submit" class="submit-btn" id="submitBtn">Create account</button>
      </form>

      <div class="auth-switch">
        Already have an account? <a href="login.html">Log in</a>
      </div>

    </div>
  </div>

  <script src="js/signup.js"></script>

</body>
</html>
